
# ----------------------------------------------------------------------
# H2 test database connection
# In-memory H2 database to allow the application to run for testing without any additional settings.
# Using system administrator default h2 database account for testing.
# Auto-quote keyword is used here since user is a reserved word in H2 database.
# This database will allow quick simulation environment set-up for quicker testing, when only the main backend component is required.
# You may need to download the required driver files as prompted.
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.auto_quote_keyword=true