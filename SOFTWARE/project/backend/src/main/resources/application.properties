spring.application.name=backend

# Logging
logging.level.com.example.backend=debug
logging.level.org.hibernate.SQL=off

# Database settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Connect to MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/va104db
spring.datasource.username=db_user
spring.datasource.password=password

# JWT Secret - This can be changed.
jwt.secret=OKxBcU0eyseHsn01oQZS4zVVR8sTuGIy3SRNapSTF14=

# Files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=160MB
upload.base-path=./uploads

# Use apache lucene for hibernate search
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.lucene_version=9.12.3
spring.jpa.properties.hibernate.search.backend.directory.root=./lucene_search_index